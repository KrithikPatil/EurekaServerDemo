server:
  port: 8761

spring:
  application:
    name: discovery-server

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false

  server:
    # Self-preservation settings (to *see* its behavior)
    enable-self-preservation: true           # Turn this off to see side-effects
    renewal-percent-threshold: 0.85          # 15% drop → self-preservation kicks in
    eviction-interval-timer-in-ms: 60000     # How often eviction task runs
